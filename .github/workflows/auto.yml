name: Auto
run-name: Auto · ${{ inputs.mode || 'run' }} · ${{ github.event_name }}

on:
  schedule:
    - cron: "30 22 * * *" # 北京时间每天 06:30
    - cron: "17 2,8,14 * * *" # 北京时间 10:17、16:17、22:17 备用检查
  workflow_dispatch:
    inputs:
      mode:
        description: "run 执行任务；inspect 只检查活动与任务状态"
        type: choice
        options:
          - run
          - inspect
        default: run

permissions:
  actions: read
  contents: read

concurrency:
  group: juejin-auto
  cancel-in-progress: false

env:
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  CheckIn:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check daily completion
        id: daily
        uses: actions/github-script@v9
        with:
          retries: 3
          script: |
            const check = require('./.github/scripts/daily-schedule.cjs');
            await check({ github, context, core });
      - uses: actions/setup-node@v7
        if: steps.daily.outputs.should_run == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        if: steps.daily.outputs.should_run == 'true'
        run: npm ci
      - name: Build local SDK
        if: steps.daily.outputs.should_run == 'true'
        run: npm run build
      - name: Run offline tests
        if: steps.daily.outputs.should_run == 'true'
        run: npm test
      - name: Run daily tasks
        if: steps.daily.outputs.should_run == 'true'
        run: npm run checkin
        env:
          TASK_MODE: ${{ inputs.mode || 'run' }}
          AUTO_READ_ARTICLES: ${{ vars.AUTO_READ_ARTICLES || 'true' }}
          READING_MAX_ARTICLES: ${{ vars.READING_MAX_ARTICLES || '5' }}
          AUTO_LIKE_ARTICLES: ${{ vars.AUTO_LIKE_ARTICLES || 'true' }}
          AUTO_LIKE_PINS: ${{ vars.AUTO_LIKE_PINS || 'true' }}
          AUTO_COLLECT_ARTICLES: ${{ vars.AUTO_COLLECT_ARTICLES || 'true' }}
          AUTO_FOLLOW_USERS: ${{ vars.AUTO_FOLLOW_USERS || 'true' }}
          AUTO_CLAIM_LUCKY: ${{ vars.AUTO_CLAIM_LUCKY || 'true' }}
          FOLLOW_USER_IDS: ${{ vars.FOLLOW_USER_IDS }}
          COLLECTION_ID: ${{ vars.COLLECTION_ID }}
          COOKIE: ${{ secrets.COOKIE }}
          COOKIE_2: ${{ secrets.COOKIE_2 }}
          COOKIE_3: ${{ secrets.COOKIE_3 }}
          COOKIE_4: ${{ secrets.COOKIE_4 }}
          COOKIE_5: ${{ secrets.COOKIE_5 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_USER_ID: ${{ secrets.TG_USER_ID }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DINGDING_WEBHOOK: ${{ secrets.DINGDING_WEBHOOK }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          WEIXIN_WEBHOOK: ${{ secrets.WEIXIN_WEBHOOK }}
          SERVERPUSHKEY: ${{ secrets.SERVERPUSHKEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          BARK_WEBHOOK: ${{ secrets.BARK_WEBHOOK }}
      - name: Write daily completion
        if: steps.daily.outputs.should_run == 'true' && inputs.mode != 'inspect'
        run: date -u +%FT%TZ > "$RUNNER_TEMP/juejin-daily-completed.txt"
      - name: Save daily completion
        if: steps.daily.outputs.should_run == 'true' && inputs.mode != 'inspect'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.daily.outputs.completion_name }}
          path: ${{ runner.temp }}/juejin-daily-completed.txt
          if-no-files-found: error
          retention-days: 3
          overwrite: true
